[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["OctoFHIR Team"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/octofhir/fml-rs"
homepage = "https://github.com/octofhir/fml-rs"
keywords = ["fhir", "fml", "structuremap", "healthcare", "mapping"]
categories = ["parser-implementations", "development-tools"]

# Tests run FHIRPath over thousands of resources (the cross-version conversion); optimise the
# dependencies in debug builds too. The workspace's own crates stay unoptimised for debugging.
[profile.dev.package."*"]
opt-level = 2
