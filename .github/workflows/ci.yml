name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: scripts/fetch-corpus.sh
      - run: cargo test --test corpus -- --nocapture
      - run: cargo test -p fml-engine --features fhirpath --test test_cases -- --nocapture
      - run: cargo test -p fml-engine --features fhirpath --test cross_version -- --nocapture
      - run: scripts/reference.sh
      - run: cargo test -p fml-model --test reference -- --nocapture

  offline-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check independent embedded-schema and FHIRPath consumers
        run: cargo run --manifest-path tests/offline-consumer/Cargo.toml
      - name: Reject HTTP and package loading in library dependencies
        shell: bash
        run: |
          cargo tree --manifest-path tests/offline-consumer/Cargo.toml --edges normal,build --prefix none > library-deps.txt
          if grep -E '^(octofhir-canonical-manager|reqwest|hyper|rustls|native-tls|openssl-sys|clap|sqlx|rusqlite) v' library-deps.txt; then
            echo "HTTP or package loading leaked into the library"
            exit 1
          fi
