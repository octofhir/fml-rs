[package]
name = "fml-cli"
description = "Command-line tool for the FHIR Mapping Language: format, check, compile, print and run maps"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "fml"
path = "src/main.rs"

[features]
default = ["lsp"]
# `fml lsp`: the language server over standard input and output.
lsp = ["dep:fml-lsp"]

[dependencies]
fml-lsp = { path = "../fml-lsp", version = "0.2.5", optional = true }
fml-syntax = { path = "../fml-syntax", version = "0.2.5" }
fml-model = { path = "../fml-model", version = "0.2.5" }
fml-check = { path = "../fml-check", version = "0.2.5", features = ["fhirschema"] }
fml-engine = { path = "../fml-engine", version = "0.2.5", features = ["fhirpath"] }
fml-xml = { path = "../fml-xml", version = "0.2.5" }
tokio = { version = "1", features = ["rt"] }
octofhir-canonical-manager = { version = "0.2.11", default-features = false, features = ["sqlite"] }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
